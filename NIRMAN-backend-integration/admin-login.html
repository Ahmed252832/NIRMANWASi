<!doctype html>

<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Separate NIRMAN administrator login.">
    <title>Admin Login | NIRMAN</title>
    <link href="bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
  </head>
  <body class="auth-page admin-auth">
    <main class="auth-shell">
      <section class="auth-showcase" aria-labelledby="adminWelcomeTitle">
        <a class="brand-logo brand-logo-light" href="index.html">
          <span class="brand-symbol" aria-hidden="true"></span><span>NIRMAN</span>
        </a>
         <div class="auth-showcase-copy">
           <h1 id="adminWelcomeTitle">NIRMAN</h1>
         </div>
      </section>

      <section class="auth-form-panel">
        <a class="auth-back-link" href="index.html"><span aria-hidden="true">&larr;</span> Back to public site</a>
        <div class="auth-form-heading">
           <h2>Administrator login</h2>
        </div>

        <div id="adminFeedback" aria-live="polite"></div>

        <form id="adminLoginForm">
          <div class="mb-3">
            <label class="form-label" for="adminEmail">Admin email</label>
            <input class="form-control" type="email" id="adminEmail" autocomplete="username" required placeholder="Enter admin email">
          </div>
          <div class="mb-4">
            <label class="form-label" for="adminPassword">Password</label>
            <input class="form-control" type="password" id="adminPassword" autocomplete="current-password" required placeholder="Enter Admin password">
          </div>
          <button class="btn btn-nirman w-100" type="submit">Login as Admin</button>
        </form>

        <p class="auth-switch">Not an admin? <a href="login.html">User login</a></p>
      </section>
    </main>

    <script src="js/data.js"></script>
    <script src="js/common.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
